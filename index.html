<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>伊能忠敬の浪漫歩行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js"
  }
}
</script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: #223a2e;
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    color: #fff;
    overscroll-behavior: none;
    user-select: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    padding: 12px;
    gap: 10px;
  }

  /* タイトル */
  #title {
    font-family: "Yuji Syuku", serif;
    font-size: 28px;
    text-align: center;
    letter-spacing: 0.12em;
    color: #ead9ad;
    text-shadow:
      0 0 1px rgba(0,0,0,0.5),
      1px 1px 2px rgba(0,0,0,0.4);
    margin: 4px 0 2px;
  }
  #title .subtitle-ja {
    display: block;
    font-family: "Yuji Syuku", serif;
    font-size: 15px;
    letter-spacing: 0.2em;
    color: #cbb98a;
    margin-top: 4px;
  }
  #title .sub {
    display: block;
    font-family: "Yuji Syuku", serif;
    font-size: 12px;
    letter-spacing: 0.3em;
    color: #8fa08f;
    margin-top: 2px;
  }

  /* ヘッダー：所持金表示 */
  #header {
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .player-card {
    flex: 1;
    background: #2f4a3c;
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 12px;
    border: 2px solid transparent;
  }
  .player-card.active {
    border-color: #ffd54f;
    background: #3a5c4a;
  }
  .player-card .name { font-weight: bold; display: flex; align-items: center; gap: 4px; }
  .player-card .money { font-size: 15px; font-weight: bold; margin-top: 2px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .cpu-badge {
    font-size: 9px;
    font-weight: bold;
    color: #223a2e;
    background: #ffd54f;
    border-radius: 6px;
    padding: 1px 6px;
    letter-spacing: 0.05em;
    vertical-align: middle;
  }

  /* 操作エリア（サイコロ＋方向パッド） */
  #controls {
    background: #2f4a3c;
    border-radius: 14px;
    padding: 12px;
    text-align: center;
  }
  #message {
    min-height: 38px;
    font-size: 13px;
    margin-bottom: 8px;
    line-height: 1.4;
  }
  #dice-area {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 10px;
  }
  #dice {
    width: 50px; height: 50px;
    background: #fff;
    color: #222;
    border-radius: 10px;
    font-size: 24px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #dice.rolling { animation: shake 0.1s infinite; }
  @keyframes shake {
    0% { transform: rotate(0deg); }
    50% { transform: rotate(10deg); }
    100% { transform: rotate(-10deg); }
  }
  button {
    font-family: inherit;
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 15px;
    font-weight: bold;
    background: #ffd54f;
    color: #223a2e;
    cursor: pointer;
  }
  button:disabled {
    background: #5c5c5c;
    color: #aaa;
  }
  button:active:not(:disabled) { transform: scale(0.94); }

  /* 方向パッド */
  #dpad {
    display: grid;
    grid-template-columns: 48px 48px 48px;
    grid-template-rows: 48px 48px 48px;
    gap: 4px;
    justify-content: center;
    margin: 0 auto;
  }
  #dpad button {
    padding: 0;
    font-size: 18px;
    border-radius: 8px;
  }
  #dpad .center {
    background: #16281f;
    color: #ffd54f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: bold;
    border-radius: 8px;
  }
  #btn-up    { grid-column: 2; grid-row: 1; }
  #btn-left  { grid-column: 1; grid-row: 2; }
  #btn-center{ grid-column: 2; grid-row: 2; }
  #btn-right { grid-column: 3; grid-row: 2; }
  #btn-down  { grid-column: 2; grid-row: 3; }

  #restart-btn {
    margin-top: 10px;
    background: #7a90a4;
    color: #fff;
    display: none;
  }

  /* 盤面（カメラ追従ビューポート） */
  #board-wrap {
    background: #16281f;
    border-radius: 14px;
    padding: 10px;
    display: flex;
    justify-content: center;
  }
  #board-viewport {
    width: 440px;
    height: 300px;
    overflow: hidden;
    position: relative;
    border-radius: 10px;
    box-shadow: inset 0 0 0 2px rgba(234, 217, 173, 0.3);
  }
  #board {
    position: absolute;
    top: 0;
    left: 0;
    width: 1500px;
    height: 1500px;
    transform-origin: 0 0;
    display: grid;
    grid-template-columns: repeat(20, 75px);
    grid-template-rows: repeat(20, 75px);
    background-image: url('pixel_art_output.png');
    background-size: cover;
    background-position: center;
    transition: transform 1.6s cubic-bezier(0.4, 0.0, 0.2, 1);
    will-change: transform;
  }
  /* 3Dモデル（姫路城）を重ねるレイヤー。#boardと同じtransformを常に適用し、
     カメラのパン・ズームに完全同期させる。renderBoard()での再描画では消えない
     ように#boardの外側（同じ#board-viewport内）に独立して置いている */
  #castle-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 1500px;
    height: 1500px;
    transform-origin: 0 0;
    transition: transform 1.6s cubic-bezier(0.4, 0.0, 0.2, 1);
    pointer-events: none;
    will-change: transform;
  }
  #castle-mount {
    position: absolute;
    left: 847.5px;   /* x=12マス目 中央寄せ */
    top: 580px;      /* y=9マス目の底に立つ高さ */
    width: 180px;
    height: 220px;
    pointer-events: none;
  }
  #castle-mount canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #castle-loading {
    position: absolute;
    left: 0; right: 0; bottom: 6px;
    text-align: center;
    font-size: 9px;
    color: #ead9ad;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    letter-spacing: 0.1em;
    pointer-events: none;
  }
  .cell {
    position: relative;
    width: 75px;
    height: 75px;
    background: rgba(58, 92, 74, 0.2);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    outline: 1px solid rgba(234, 217, 173, 0.3);
  }
  .cell.event-money { background: rgba(74, 108, 58, 0.3); }
  .cell.event-loss { background: rgba(108, 58, 58, 0.3); }
  .cell.event-teahouse { background: rgba(160, 110, 40, 0.3); }
  .cell.event-inn { background: rgba(90, 60, 120, 0.3); }
  .cell.info { background: rgba(138, 109, 59, 0.3); }
  .cell.start { background: rgba(184, 134, 11, 0.2); }
  .cell.goal { background: rgba(184, 48, 92, 0.55); }
  .cell.info .icon {
    animation: pulse-info 1.6s ease-in-out infinite;
  }
  @keyframes pulse-info {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }
  .cell .icon { font-size: 40px; display: flex; align-items: center; justify-content: center; }
  .cell .icon svg, .cell .icon img { display: block; max-width: 96%; max-height: 96%; object-fit: contain; }
  .tokens {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 0;
    pointer-events: none;
  }
  .token {
    height: 70px;
    width: auto;
    max-width: 46px;
    object-fit: contain;
    object-position: bottom;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.6));
    margin: 0 -6px;
  }

  /* カメラ切り替えボタン */
  #camera-controls {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 8px;
  }
  #camera-controls button {
    background: #7a90a4;
    color: #fff;
    font-size: 13px;
    padding: 8px 16px;
  }
  #camera-controls button.active-mode {
    background: #ffd54f;
    color: #223a2e;
  }


  /* 案内カード（史跡ポップアップ） */
  #info-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 16, 12, 0.72);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 50;
  }
  #info-overlay.hidden { display: none; }
  #info-card {
    background: #ead9ad;
    color: #3a2c18;
    border: 3px double #6b4f2a;
    border-radius: 8px;
    max-width: 360px;
    width: 100%;
    padding: 20px 18px;
    text-align: center;
  }
  #info-card .badge {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: #8a6d3b;
    border: 1px solid #8a6d3b;
    border-radius: 12px;
    padding: 2px 10px;
    margin-bottom: 10px;
  }
  #info-card h3 {
    font-family: "Yuji Syuku", serif;
    font-size: 24px;
    letter-spacing: 0.08em;
    margin: 0 0 12px;
  }
  #info-card p {
    font-size: 13px;
    line-height: 1.7;
    margin: 0 0 18px;
    text-align: left;
  }
  #info-card button {
    background: #6b4f2a;
    color: #ead9ad;
    width: 100%;
  }

  /* ゲーム結果ポップアップ */
  #result-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 16, 12, 0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 60;
  }
  #result-overlay.hidden { display: none; }
  #result-card {
    background: #ead9ad;
    color: #3a2c18;
    border: 3px double #6b4f2a;
    border-radius: 8px;
    max-width: 360px;
    width: 100%;
    padding: 22px 20px;
    text-align: center;
  }
  #result-card .badge {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: #8a6d3b;
    border: 1px solid #8a6d3b;
    border-radius: 12px;
    padding: 2px 10px;
    margin-bottom: 10px;
  }
  #result-card h3 {
    font-family: "Yuji Syuku", serif;
    font-size: 20px;
    letter-spacing: 0.06em;
    margin: 0 0 16px;
    line-height: 1.5;
  }
  #result-scores {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 16px;
  }
  .result-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    border-radius: 8px;
    background: rgba(107, 79, 42, 0.12);
    font-size: 14px;
    font-weight: bold;
  }
  .result-row.winner {
    background: #ffd54f;
    box-shadow: 0 0 0 2px #b8860b inset;
  }
  #result-champion {
    font-family: "Yuji Syuku", serif;
    font-size: 22px;
    letter-spacing: 0.06em;
    margin: 0 0 18px;
    color: #8a1f3a;
  }
  #result-card button {
    background: #6b4f2a;
    color: #ead9ad;
    width: 100%;
  }

  /* キャラクター選択画面 */
  #character-select-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 16, 12, 0.92);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 70;
  }
  #character-select-overlay.hidden { display: none; }
  #character-select-card {
    background: #ead9ad;
    color: #3a2c18;
    border: 3px double #6b4f2a;
    border-radius: 8px;
    max-width: 380px;
    width: 100%;
    padding: 26px 20px;
    text-align: center;
  }
  #character-select-card .badge {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: #8a6d3b;
    border: 1px solid #8a6d3b;
    border-radius: 12px;
    padding: 2px 10px;
    margin-bottom: 10px;
  }
  #character-select-card h3 {
    font-family: "Yuji Syuku", serif;
    font-size: 20px;
    letter-spacing: 0.06em;
    margin: 0 0 20px;
    line-height: 1.5;
  }
  .character-options {
    display: flex;
    justify-content: center;
    gap: 16px;
  }
  .character-option {
    flex: 1;
    max-width: 150px;
    background: rgba(107, 79, 42, 0.1);
    border: 2px solid transparent;
    border-radius: 10px;
    padding: 12px 8px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  .character-option:hover,
  .character-option:active {
    border-color: #b8860b;
    background: rgba(184, 134, 11, 0.15);
  }
  .character-option img {
    height: 120px;
    width: auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));
  }
  .character-option span {
    font-family: "Yuji Syuku", serif;
    font-size: 16px;
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>
<div id="app">
  <h1 id="title">伊能忠敬の浪漫歩行<span class="subtitle-ja">播磨・摂津・丹波の旅</span><span class="sub">ROMANTIC WALK OF INO TADATAKA</span></h1>
  <div id="header"></div>

  <div id="controls">
    <div id="message">ゲームを開始します。武士の番です。</div>
    <div id="dice-area">
      <div id="dice">?</div>
      <button id="roll-btn">サイコロを振る</button>
    </div>
    <div id="dpad">
      <button id="btn-up">↑</button>
      <button id="btn-left">←</button>
      <div id="btn-center" class="center">-</div>
      <button id="btn-right">→</button>
      <button id="btn-down">↓</button>
    </div>
    <button id="restart-btn">もう一度あそぶ</button>
  </div>

  <div id="board-wrap">
    <div id="board-viewport">
      <div id="board"></div>
      <div id="castle-layer">
        <div id="castle-mount">
          <div id="castle-loading">姫路城 読込中…</div>
        </div>
      </div>
    </div>
  </div>
  <div id="camera-controls">
    <button id="btn-overview">🗺️ 全体</button>
    <button id="btn-follow" class="active-mode">📍 現在地</button>
  </div>
</div>

<div id="character-select-overlay">
  <div id="character-select-card">
    <span class="badge">キャラクター選択</span>
    <h3>あなたが操作するキャラクターを<br>選んでください</h3>
    <div class="character-options">
      <button class="character-option" data-idx="0">
        <img src="player_01_D.png" alt="武士">
        <span>武士</span>
      </button>
      <button class="character-option" data-idx="1">
        <img src="player_02_D.png" alt="町娘">
        <span>町娘</span>
      </button>
    </div>
  </div>
</div>

<div id="info-overlay" class="hidden">
  <div id="info-card">
    <span id="info-badge" class="badge">兵庫県 史跡案内</span>
    <h3 id="info-title"></h3>
    <p id="info-desc"></p>
    <button id="info-close">とじる</button>
  </div>
</div>

<div id="result-overlay" class="hidden">
  <div id="result-card">
    <span class="badge">ゲーム終了</span>
    <h3 id="result-headline"></h3>
    <div id="result-scores"></div>
    <p id="result-champion"></p>
    <button id="result-close">とじる</button>
  </div>
</div>

<script>
/* =========================================================
   盤面設定：20 x 20 = 400マス、座標 (x, y) はどちらも 0〜19
   カメラは常に「現在の手番のキャラクター」を中心に映す
   ========================================================= */
const GRID = 20;
const CELL_SIZE = 75;                  // 1マスのピクセルサイズ
const WORLD_SIZE = CELL_SIZE * GRID;   // 盤面全体のピクセルサイズ (1500px)
const VIEWPORT_WIDTH = 440;            // 画面に見えている窓の幅
const VIEWPORT_HEIGHT = 300;           // 画面に見えている窓の高さ
// 盤面(1500px四方)は窓(440×300px)より大きいので、常にキャラクターを中心にズームして
// 縦横どちらの方向にもカメラがパンする（以前の見え方と同じ挙動）
const PLAYER_COLORS = ['#ff6b6b', '#4dabf7'];
/* 方向ごとの静止画（D=下/停止時, U=上, L=左, R=右） */
const PLAYER_DIRECTION_IMAGES = [
  { down: 'player_01_D.png', up: 'player_01_U.png', left: 'player_01_L.png', right: 'player_01_R.png' },
  { down: 'player_02_D.png', up: 'player_02_U.png', left: 'player_02_L.png', right: 'player_02_R.png' },
];
function getPlayerImage(player) {
  return PLAYER_DIRECTION_IMAGES[player.idx][player.facing];
}
const PLAYER_NAMES = ['武士', '町娘'];

/* 小判アイコン（ユーザー作成のオリジナル画像ファイルを参照） */
const KOBAN_SVG = `<img src="koban.svg" alt="小判" style="width:40px;height:auto;display:block;">`;
const FLYING_KOBAN_SVG = `<img src="flying_koban.svg" alt="小判（羽根つき）" style="width:48px;height:auto;display:block;">`;


/* 兵庫県内の史跡（案内マス用データ）
   座標(x, y)は盤面0〜9の固定マス指定。
   ※以下2点は元データを補正しています:
     - (10,7)→(9,7)、(10,6)→(9,6)：盤面が0〜9のため範囲内に補正
     - 篠山城跡と生野銀山が共に(9,3)で重複していたため、生野銀山を隣接する(9,2)に調整 */
const HISTORICAL_SITES = [
  { x: 12, y: 9, title: '姫路城', desc: '白鷺城とも呼ばれる白亜の名城。江戸時代初期の姿をほぼそのまま残す天守群は、日本で最初にユネスコ世界文化遺産に登録された。' },
  { x: 16, y: 2, title: '竹田城跡', desc: '朝霧に包まれると山の上に浮かんで見えることから「天空の城」と呼ばれる山城跡。石垣だけが残り、往時の壮大な姿を今に伝える。' },
  { x: 18, y: 14, title: '明石城', desc: '江戸幕府によって築かれた城で、天守は築かれなかったものの、現存する巽櫓・坤櫓の2つの三重櫓が今も明石のシンボルとして残る。' },
  { x: 15, y: 6, title: '篠山城跡', desc: '徳川家康の命により天下普請で築かれた城。大書院が復元され、丹波篠山の城下町の中心として親しまれている。' },
  { x: 16, y: 12, title: '有馬温泉', desc: '日本三古湯の一つに数えられる、1300年以上の歴史を持つ名湯。豊臣秀吉も度々訪れたと伝わる、歴史ある温泉街。' },
  { x: 16, y: 4, title: '生野銀山', desc: '平安時代からの歴史を持つ日本有数の銀山跡。江戸時代には幕府直轄の鉱山として栄え、日本の近代化にも貢献した。' },
  { x: 4, y: 6, title: '龍野', desc: '揖保川沿いに発展した歴史ある城下町。龍野城跡を中心に、武家屋敷や白壁の町並みが残り、「播磨の小京都」とも呼ばれる。' },
  { x: 1, y: 12, title: '赤穂城跡', desc: '赤穂浪士で知られる赤穂藩の居城跡。忠臣蔵の舞台としても有名で、大石内蔵助ら家臣が仕えた城として語り継がれている。' },
  { x: 6, y: 4, title: '旧古井家住宅（千年家）', desc: '兵庫県姫路市に残る古民家で、室町時代後期に建てられたとされる貴重な民家。日本最古級の民家の一つとして知られ、「千年家」の名で親しまれている。' },
];
function isInfoSpot(x, y) {
  return HISTORICAL_SITES.some(s => s.x === x && s.y === y);
}

/* 海エリア（MASK）：スタート・ゴール・茶屋・旅籠・小判・逆さ小判を配置しない */
const MASK = [
  // 20×20盤面向けに再配置（元の10×10版MASKを2倍解像度にスケーリング）
  {x:2, y:14}, {x:3, y:14}, {x:4, y:14}, {x:5, y:14}, {x:6, y:14}, {x:7, y:14}, {x:8, y:14}, {x:9, y:14}, {x:10, y:14}, {x:11, y:14}, {x:12, y:14}, {x:13, y:14}, {x:14, y:14}, {x:15, y:14},
  {x:2, y:15}, {x:3, y:15}, {x:4, y:15}, {x:5, y:15}, {x:6, y:15}, {x:7, y:15}, {x:8, y:15}, {x:9, y:15}, {x:10, y:15}, {x:11, y:15}, {x:12, y:15}, {x:13, y:15}, {x:14, y:15}, {x:15, y:15},
  {x:0, y:16}, {x:1, y:16}, {x:2, y:16}, {x:3, y:16}, {x:4, y:16}, {x:5, y:16}, {x:6, y:16}, {x:7, y:16}, {x:8, y:16}, {x:9, y:16}, {x:10, y:16}, {x:11, y:16}, {x:12, y:16}, {x:13, y:16}, {x:14, y:16}, {x:15, y:16}, {x:16, y:16}, {x:17, y:16},
  {x:0, y:17}, {x:1, y:17}, {x:2, y:17}, {x:3, y:17}, {x:4, y:17}, {x:5, y:17}, {x:6, y:17}, {x:7, y:17}, {x:8, y:17}, {x:9, y:17}, {x:10, y:17}, {x:11, y:17}, {x:12, y:17}, {x:13, y:17}, {x:14, y:17}, {x:15, y:17}, {x:16, y:17}, {x:17, y:17},
  {x:0, y:18}, {x:1, y:18}, {x:2, y:18}, {x:3, y:18}, {x:4, y:18}, {x:5, y:18}, {x:6, y:18}, {x:7, y:18}, {x:8, y:18}, {x:9, y:18}, {x:10, y:18}, {x:11, y:18}, {x:12, y:18}, {x:13, y:18}, {x:14, y:18}, {x:15, y:18},
  {x:0, y:19}, {x:1, y:19}, {x:2, y:19}, {x:3, y:19}, {x:4, y:19}, {x:5, y:19}, {x:6, y:19}, {x:7, y:19}, {x:8, y:19}, {x:9, y:19}, {x:10, y:19}, {x:11, y:19}, {x:12, y:19}, {x:13, y:19}, {x:14, y:19}, {x:15, y:19},
];
function isMasked(x, y) {
  return MASK.some(m => m.x === x && m.y === y);
}

/* ===== スタート・ゴールをランダムに決める ===== */
let STARTPOS = null;
let GOALPOS = null;

function randomPos() {
  return { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
}
function manhattan(a, b) {
  return Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
}
function pickStartAndGoal() {
  let start, goal, tries;

  // 史跡マス・海（MASK）は避けてスタート位置を決める
  tries = 0;
  do {
    start = randomPos();
    tries++;
  } while ((isInfoSpot(start.x, start.y) || isMasked(start.x, start.y)) && tries < 500);

  // 史跡マス・海（MASK）を避け、かつスタートからある程度離れた場所をゴールにする
  tries = 0;
  do {
    goal = randomPos();
    tries++;
  } while ((isInfoSpot(goal.x, goal.y) || isMasked(goal.x, goal.y) || manhattan(start, goal) < 20) && tries < 500);

  return { start, goal };
}

function generateBoard() {
  const { start, goal } = pickStartAndGoal();
  STARTPOS = start;
  GOALPOS = goal;

  // まず全マスを「normal（何もなし）」で初期化
  const board = [];
  for (let y = 0; y < GRID; y++) {
    const row = [];
    for (let x = 0; x < GRID; x++) {
      row.push({ type: 'normal', label: '', icon: '' });
    }
    board.push(row);
  }

  board[start.y][start.x] = { type: 'start', label: 'スタート', icon: '🏁' };
  board[goal.y][goal.x] = { type: 'goal', label: 'ゴール', icon: '🎌' };

  // 史跡の案内マス（iマーク）を指定座標に固定配置
  HISTORICAL_SITES.forEach(site => {
    board[site.y][site.x] = {
      type: 'info',
      label: 'i',
      icon: 'ℹ️',
      site,
    };
  });

  // スタート・ゴール・史跡マス・海（MASK）を除いた配置候補マスを集める
  const candidates = [];
  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      const isStart = (x === start.x && y === start.y);
      const isGoal = (x === goal.x && y === goal.y);
      if (!isStart && !isGoal && !isInfoSpot(x, y) && !isMasked(x, y)) {
        candidates.push({ x, y });
      }
    }
  }
  // シャッフル
  for (let i = candidates.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
  }

  // 小判(+)・逆さ小判(-)・茶屋・旅籠を、それぞれ3マスずつ固定個数で配置
  const COUNT_PER_TYPE = 3;
  let cursor = 0;

  for (let i = 0; i < COUNT_PER_TYPE && cursor < candidates.length; i++, cursor++) {
    const { x, y } = candidates[cursor];
    const amount = (Math.floor(Math.random() * 4) + 1) * 100;
    board[y][x] = { type: 'event-money', label: `+${amount}`, icon: KOBAN_SVG, amount, revealed: false };
  }
  for (let i = 0; i < COUNT_PER_TYPE && cursor < candidates.length; i++, cursor++) {
    const { x, y } = candidates[cursor];
    const amount = (Math.floor(Math.random() * 3) + 1) * 100;
    board[y][x] = { type: 'event-loss', label: `-${amount}`, icon: FLYING_KOBAN_SVG, amount, revealed: false };
  }
  for (let i = 0; i < COUNT_PER_TYPE && cursor < candidates.length; i++, cursor++) {
    const { x, y } = candidates[cursor];
    board[y][x] = { type: 'event-teahouse', label: '茶屋', icon: '🍡' };
  }
  for (let i = 0; i < COUNT_PER_TYPE && cursor < candidates.length; i++, cursor++) {
    const { x, y } = candidates[cursor];
    board[y][x] = { type: 'event-inn', label: '旅籠', icon: '🏮' };
  }

  return board;
}

let CPU_PLAYER_INDEX = 1; // どちらをCPUにするかは、最初のキャラクター選択で決まる（デフォルトは町娘）

/* ===== 状態 ===== */
let board = generateBoard();
let players = PLAYER_NAMES.map((name, i) => ({
  name, color: PLAYER_COLORS[i], idx: i, facing: 'down', x: STARTPOS.x, y: STARTPOS.y, money: 1000, diceBonus: 0,
  isCPU: i === CPU_PLAYER_INDEX,

let currentPlayer = 0;
let gameOver = false;
let rolling = false;
let remainingSteps = 0;

/* ===== DOM参照 ===== */
const headerEl = document.getElementById('header');

const messageEl = document.getElementById('message');

/* ===== カメラ（現在のキャラクターを中心に映す／全体を見る） ===== */
let cameraMode = 'follow'; // 'follow' | 'overview'

function centerCameraOn(x, y) {
  cameraMode = 'follow';
  btnFollow.classList.add('active-mode');
  btnOverview.classList.remove('active-mode');

  const cellCenterX = (x + 0.5) * CELL_SIZE;
  const cellCenterY = (y + 0.5) * CELL_SIZE;
  let tx = VIEWPORT_WIDTH / 2 - cellCenterX;
  let ty = VIEWPORT_HEIGHT / 2 - cellCenterY;
  const minTx = Math.min(0, VIEWPORT_WIDTH - WORLD_SIZE);  // 端でこれ以上は動かさない
  const minTy = Math.min(0, VIEWPORT_HEIGHT - WORLD_SIZE);
  const maxTx = Math.max(0, VIEWPORT_WIDTH - WORLD_SIZE);  // 盤面が窓より小さい方向は中央寄せ
  const maxTy = Math.max(0, VIEWPORT_HEIGHT - WORLD_SIZE);
  tx = Math.max(minTx, Math.min(maxTx, tx));
  ty = Math.max(minTy, Math.min(maxTy, ty));
  boardEl.style.transform = `translate(${tx}px, ${ty}px) scale(1)`;
  castleLayerEl.style.transform = boardEl.style.transform; // 3D姫路城レイヤーも同じカメラ挙動に同期
}

function showOverview() {
  cameraMode = 'overview';
  btnOverview.classList.add('active-mode');
  btnFollow.classList.remove('active-mode');

  // 盤面全体が窓にぴったり収まる縮尺（縦横どちらも欠けないよう小さい方に合わせる）
  const s = Math.min(VIEWPORT_WIDTH / WORLD_SIZE, VIEWPORT_HEIGHT / WORLD_SIZE);
  const scaledSize = WORLD_SIZE * s;
  const offsetX = (VIEWPORT_WIDTH - scaledSize) / 2;
  const offsetY = (VIEWPORT_HEIGHT - scaledSize) / 2;
  boardEl.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${s})`;
  castleLayerEl.style.transform = boardEl.style.transform; // 3D姫路城レイヤーも同じカメラ挙動に同期
}

function showCurrentLocation() {

}

/* ===== 汎用ポップアップ（史跡案内／茶屋／旅籠で共用） ===== */

/* ===== ゲーム結果ポップアップ ===== */
function showResultPopup(arrivedPlayer) {

  const sorted = [...players].sort((a, b) => b.money - a.money);

resultCloseBtn.addEventListener('click', () => resultOverlay.classList.add('hidden'));

/* ===== 描画 ===== */
function renderHeader() {
  headerEl.innerHTML = '';
  players.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'player-card' + (i === currentPlayer && !gameOver ? ' active' : '');
    card.innerHTML = `
      <div class="name"><span class="dot" style="background:${p.color}"></span>${p.name}${p.isCPU ? ' <span class="cpu-badge">CPU</span>' : ''}</div>

    `;

function renderBoard() {
  boardEl.innerHTML = '';
  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < GRID; x++) {
      const cell = board[y][x];
      // 小判・逆さ小判マスは、誰かが実際に止まって発見するまでは通常マスと同じ見た目で隠しておく
      const isHiddenTreasure = (cell.type === 'event-money' || cell.type === 'event-loss') && !cell.revealed;
      const div = document.createElement('div');
      div.className = 'cell ' + (isHiddenTreasure ? 'normal' : cell.type);

        .filter(p => p.x === x && p.y === y)
        .map(p => `<img class="token" src="${getPlayerImage(p)}" alt="${p.name}">`)
        .join('');

}

function renderAll() {
  renderHeader();
  renderBoard();
}

/* ===== 方向パッドの有効/無効切り替え ===== */
function updateDpad() {
  const p = players[currentPlayer];
  const active = remainingSteps > 0 && !gameOver && !rolling && !p.isCPU;
  btnUp.disabled = !active || p.y === 0;
  btnDown.disabled = !active || p.y === GRID - 1;
  btnLeft.disabled = !active || p.x === 0;
  btnRight.disabled = !active || p.x === GRID - 1;
  centerEl.textContent = remainingSteps > 0 ? `残り${remainingSteps}` : '-';
}

/* ===== サイコロ ===== */
function rollDice(onComplete) {
  if (rolling || gameOver || remainingSteps > 0) return;
  rolling = true;
  rollBtn.disabled = true;
  diceEl.classList.add('rolling');
  messageEl.textContent = `${players[currentPlayer].name}がサイコロを振っています…`;

  let ticks = 0;
  const maxTicks = 10;
  const interval = setInterval(() => {
    diceEl.textContent = String(Math.floor(Math.random() * 6) + 1);
    ticks++;
    if (ticks >= maxTicks) {
      clearInterval(interval);
      const player = players[currentPlayer];
      const base = Math.floor(Math.random() * 6) + 1;
      const bonus = player.diceBonus || 0;
      const result = base + bonus;
      player.diceBonus = 0; // ボーナスは1回使ったらリセット
      diceEl.textContent = String(result);
      diceEl.classList.remove('rolling');
      rolling = false;
      remainingSteps = result;
      messageEl.textContent = bonus > 0
        ? `${player.name}：サイコロ${base}＋元気ボーナス${bonus}＝残り${result}歩。上下左右に自由に進もう！`
        : `${player.name}：残り${result}歩。上下左右に自由に進もう！`;
      updateDpad();
      if (onComplete) onComplete();
    }
  }, 80);
}

/* ===== 移動 ===== */
function tryMove(dir) {
  if (remainingSteps <= 0 || gameOver || rolling) return;
  const player = players[currentPlayer];
  let { x, y } = player;
  player.facing = dir;
  if (dir === 'up') y -= 1;
  else if (dir === 'down') y += 1;
  else if (dir === 'left') x -= 1;
  else if (dir === 'right') x += 1;
  if (x < 0 || x > GRID - 1 || y < 0 || y > GRID - 1) return;

  const isGoalCell = (x === GOALPOS.x && y === GOALPOS.y);
  const stepsLeftAfter = remainingSteps - 1;

  // ゴールはぴったりの目でないと入れない（余ったらその方向には進めない）
  if (isGoalCell && stepsLeftAfter > 0) {
    messageEl.textContent = `ちょうどの目でないとゴールできません！（あと${stepsLeftAfter}歩余ってしまいます）`;
    return;
  }

  player.x = x;
  player.y = y;
  remainingSteps = stepsLeftAfter;
  renderAll();
  updateDpad();
  centerCameraOn(player.x, player.y);

  if (isGoalCell || remainingSteps === 0) {
    landOnCell(player);
  }
}

function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

/* ===== CPU（自動操作）ロジック =====
   基本方針：「ゴールに向かって進みつつ、たまにランダム性を混ぜる」
   - 70%の確率でゴールへの距離が縮まる方向を選ぶ
   - 30%の確率で（範囲内なら）完全ランダムな方向を選ぶ */
function chooseCpuDirection(player) {
  const dirs = ['up', 'down', 'left', 'right'];
  const valid = dirs.filter(d => {
    let { x, y } = player;
    if (d === 'up') y -= 1;
    else if (d === 'down') y += 1;
    else if (d === 'left') x -= 1;
    else if (d === 'right') x += 1;
    return x >= 0 && x < GRID && y >= 0 && y < GRID;
  });
  if (valid.length === 0) return 'up'; // 実際には起こらない想定の保険

  if (Math.random() < 0.3) {
    return valid[Math.floor(Math.random() * valid.length)];
  }

  let best = valid[0];
  let bestDist = Infinity;
  valid.forEach(d => {
    let { x, y } = player;
    if (d === 'up') y -= 1;
    else if (d === 'down') y += 1;
    else if (d === 'left') x -= 1;
    else if (d === 'right') x += 1;
    const dist = Math.abs(x - GOALPOS.x) + Math.abs(y - GOALPOS.y);
    if (dist < bestDist) {
      bestDist = dist;
      best = d;
    }
  });
  return best;
}

function cpuStepLoop(attempt) {
  attempt = attempt || 0;
  if (gameOver || remainingSteps <= 0) return;
  if (attempt > 20) return; // 万一動けなくなった場合の安全装置

  const player = players[currentPlayer];
  const beforeX = player.x, beforeY = player.y, beforeSteps = remainingSteps;
  const dir = chooseCpuDirection(player);
  tryMove(dir);

  // ゴール手前で歩数が余る等の理由で動けなかった場合は、少し待って別方向を再選択
  if (player.x === beforeX && player.y === beforeY && remainingSteps === beforeSteps) {
    setTimeout(() => cpuStepLoop(attempt + 1), 300);
    return;
  }

  if (!gameOver && remainingSteps > 0) {
    setTimeout(() => cpuStepLoop(0), 500);
  }
}

function cpuPlayTurn() {
  if (gameOver) return;
  rollDice(() => {
    setTimeout(() => cpuStepLoop(0), 400);
  });
}

function triggerCPUIfNeeded() {
  if (gameOver) return;
  const player = players[currentPlayer];
  if (player.isCPU) {
    rollBtn.disabled = true;
    setTimeout(cpuPlayTurn, 900);
  }
}

function landOnCell(player) {
  const cell = board[player.y][player.x];
  let msg = `${player.name}は (${player.x}, ${player.y}) 「${cell.label || 'なにもなし'}」に止まった。`;

  if (cell.type === 'event-money') {
    cell.revealed = true;
    player.money += cell.amount;
    msg += ` ${cell.amount} 両もらった！`;
  } else if (cell.type === 'event-loss') {
    cell.revealed = true;
    player.money = Math.max(0, player.money - cell.amount);
    msg += ` ${cell.amount} 両失った…`;
  } else if (cell.type === 'event-teahouse') {
    player.money = Math.max(0, player.money - 100);
    player.diceBonus = (player.diceBonus || 0) + 1;
    msg += ' 茶屋で団子を食べた！';
  } else if (cell.type === 'event-inn') {
    player.money = Math.max(0, player.money - 500);
    player.diceBonus = (player.diceBonus || 0) + 5;
    msg += ' 旅籠に泊まった！';
  } else if (cell.type === 'goal') {
    msg += ' ゴール！';
  } else if (cell.type === 'info') {
    player.money += 300;
    msg += ' 案内板を見つけた！ 300両もらった！';
  }

  remainingSteps = 0;
  player.facing = 'down';
  renderAll();
  updateDpad();
  centerCameraOn(player.x, player.y);
  messageEl.textContent = msg;

  if (player.x === GOALPOS.x && player.y === GOALPOS.y) {
    endGame(player);
    return;
  }

  if (cell.type === 'info') {
    showInfoCard(cell.site, () => {
      rollBtn.disabled = false;
      nextTurn();
    });
    if (player.isCPU) setTimeout(() => infoCloseBtn.click(), 1200);
    return;
  }

  if (cell.type === 'event-teahouse') {
    showEventPopup(
      '茶屋',
      '団子を一服',
      '団子を100両で食べて、元気が出たので次回のサイコロの目が1つプラスされる。',
      () => {
        rollBtn.disabled = false;
        nextTurn();
      }
    );
    if (player.isCPU) setTimeout(() => infoCloseBtn.click(), 1200);
    return;
  }

  if (cell.type === 'event-inn') {
    showEventPopup(
      '旅籠',
      '一晩の宿',
      '500両で泊まり、元気が出たので次回のサイコロの目が5つプラスされる。',
      () => {
        rollBtn.disabled = false;
        nextTurn();
      }
    );
    if (player.isCPU) setTimeout(() => infoCloseBtn.click(), 1200);
    return;
  }

  rollBtn.disabled = false;
  nextTurn();
}

function nextTurn() {
  currentPlayer = (currentPlayer + 1) % players.length;
  renderHeader();
  updateDpad();
  messageEl.textContent += ` 次は${players[currentPlayer].name}の番です。`;
  // 少し間を置いてから、ゆっくりカメラを次のキャラクターへパンする
  setTimeout(() => {
    const p = players[currentPlayer];
    centerCameraOn(p.x, p.y);
  }, 400);
  triggerCPUIfNeeded();
}

function endGame(arrivedPlayer) {
  gameOver = true;
  rollBtn.disabled = true;
  restartBtn.style.display = 'inline-block';

  // 先にゴールしたプレイヤーに1,000両ボーナス
  arrivedPlayer.money += 1000;

  renderHeader();
  updateDpad();
  messageEl.textContent += ` ${arrivedPlayer.name}のゴール！ゲーム終了🎉`;

  showResultPopup(arrivedPlayer);
}

function restartGame() {
  board = generateBoard();
  players = PLAYER_NAMES.map((name, i) => ({
    name, color: PLAYER_COLORS[i], idx: i, facing: 'down', x: STARTPOS.x, y: STARTPOS.y, money: 1000, diceBonus: 0,
    isCPU: i === CPU_PLAYER_INDEX,
  }));
  currentPlayer = 0;
  gameOver = false;
  rolling = false;
  remainingSteps = 0;
  diceEl.textContent = '?';
  rollBtn.disabled = false;
  restartBtn.style.display = 'none';
  resultOverlay.classList.add('hidden');
  messageEl.textContent = `新しいスタート(${STARTPOS.x}, ${STARTPOS.y})とゴール(${GOALPOS.x}, ${GOALPOS.y})でゲームを開始します。武士の番です。`;
  renderAll();
  updateDpad();
  centerCameraOn(players[currentPlayer].x, players[currentPlayer].y);
  triggerCPUIfNeeded();
}

/* ===== イベント登録 ===== */
rollBtn.addEventListener('click', () => rollDice());
restartBtn.addEventListener('click', restartGame);
btnUp.addEventListener('click', () => tryMove('up'));
btnDown.addEventListener('click', () => tryMove('down'));
btnLeft.addEventListener('click', () => tryMove('left'));
btnRight.addEventListener('click', () => tryMove('right'));
btnOverview.addEventListener('click', showOverview);
btnFollow.addEventListener('click', showCurrentLocation);

/* ===== キャラクター選択 ===== */
const characterSelectOverlay = document.getElementById('character-select-overlay');
document.querySelectorAll('.character-option').forEach(btn => {
  btn.addEventListener('click', () => {
    const chosenIdx = Number(btn.dataset.idx);
    CPU_PLAYER_INDEX = chosenIdx === 0 ? 1 : 0;
    players.forEach((p, i) => {
      p.isCPU = (i === CPU_PLAYER_INDEX);
    });
    renderHeader();
    characterSelectOverlay.classList.add('hidden');
    triggerCPUIfNeeded();
  });
});

/* =========================================================
   伊能図ふうpixelアート（pixel_art_output.png）は
   #board の background-image として設定し、
   #board-viewport（440×300px）という窓から盤面を映している。
   盤面は20×20マス・1500×1500pxで、常にキャラクターを中心に
   ズームしながら縦横にカメラがパンする。
   「全体」ボタンで scale を縮小して盤面全体を、
   「現在地」ボタンで現在の手番のキャラクターにカメラを戻す
   ========================================================= */

/* ===== 初期描画 ===== */
messageEl.textContent = `スタート(${STARTPOS.x}, ${STARTPOS.y})からゴール(${GOALPOS.x}, ${GOALPOS.y})を目指そう。武士の番です。`;
renderAll();
updateDpad();
centerCameraOn(players[currentPlayer].x, players[currentPlayer].y);
</script>

<script type="module">
/* =========================================================
   姫路城 3Dモデル表示（x=12, y=9マス目）
   OBJ/MTLはユーザー提供データ（右手座標系・Y軸が高さ）を、
   そのままThree.js（同じく右手系・Y-up）に読み込んで表示している。
   #castle-mount はCSSで固定座標に配置し、カメラのパン・ズームは
   #castle-layer の transform を #board と同期させることで実現（index.html側）。
   ========================================================= */
import * as THREE from 'three';
import { MTLLoader } from './vendor/three/MTLLoader.js';
import { OBJLoader } from './vendor/three/OBJLoader.js';

const MOUNT_WIDTH = 180;
const MOUNT_HEIGHT = 220;
const CASTLE_TARGET_HEIGHT = 1.6; // シーン内でのモデルの目標の高さ（従来の50%サイズ）

function initCastle3D() {
  const mount = document.getElementById('castle-mount');
  const loadingEl = document.getElementById('castle-loading');
  if (!mount) return;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, MOUNT_WIDTH / MOUNT_HEIGHT, 0.1, 100);
  // Z軸を「上」として扱う（Z-up）。Three.jsは既定でY-upのため、
  // カメラの上方向ベクトルをZに切り替え、位置・注視点もZを高さとして指定する
  camera.up.set(0, 0, 1);
  camera.position.set(5.2, 5.6, 2.1);
  camera.lookAt(0, 0, CASTLE_TARGET_HEIGHT * 0.46);

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  } catch (e) {
    if (loadingEl) loadingEl.textContent = '3D表示に対応していません';
    return;
  }
  renderer.setSize(MOUNT_WIDTH, MOUNT_HEIGHT);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.domElement.style.opacity = '0';
  renderer.domElement.style.transition = 'opacity 0.8s ease';
  mount.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 1.0));
  const dirLight = new THREE.DirectionalLight(0xfff2d0, 1.0);
  dirLight.position.set(5, 4, 8);
  scene.add(dirLight);
  const fillLight = new THREE.DirectionalLight(0xbcd4ff, 0.35);
  fillLight.position.set(-4, -3, 3);
  scene.add(fillLight);

  const group = new THREE.Group();
  scene.add(group);

  const mtlLoader = new MTLLoader();
  mtlLoader.load(
    'Casstle_All_50mm.mtl',
    (materials) => {
      materials.preload();
      // 元データはマテリアル名(色の16進コード)に対してKdのR/Bチャンネルが
      // 入れ替わって出力されているため、名前から正しい色を復元する
      Object.values(materials.materials).forEach((mat) => {
        const m = /^color_([0-9a-fA-F]{6})$/.exec(mat.name || '');
        if (m && mat.color) {
          mat.color.setStyle('#' + m[1]);
        }
      });
      const objLoader = new OBJLoader();
      objLoader.setMaterials(materials);
      objLoader.load(
        'Casstle_All_50mm.obj',
        (obj) => {
          // 元データはY-upなので、まず生の寸法からスケールを決める
          const rawBox = new THREE.Box3().setFromObject(obj);
          const rawSize = new THREE.Vector3();
          rawBox.getSize(rawSize);
          const scale = CASTLE_TARGET_HEIGHT / (rawSize.y || 1);
          obj.scale.setScalar(scale);

          // 元データに法線(vn)が含まれていないため、陰影計算のために自動計算する
          obj.traverse((child) => {
            if (child.isMesh && child.geometry) {
              child.geometry.computeVertexNormals();
            }
          });

          // Y-up → Z-up への変換：X軸まわりに+90度回転させることで、
          // 高さ方向がYからZへ移る（先にスケール・回転を確定させてから位置を合わせる）
          obj.rotation.x = Math.PI / 2;

          // 回転後の実際のバウンディングボックスを基準に、中心をX/Yに、底面をZ=0に合わせる
          const box = new THREE.Box3().setFromObject(obj);
          const center = new THREE.Vector3();
          box.getCenter(center);
          obj.position.set(-center.x, -center.y, -box.min.z);

          group.add(obj);
          renderer.render(scene, camera); // 自動回転はしないため、読み込み完了時に一度だけ描画
          renderer.domElement.style.opacity = '1';
          if (loadingEl) loadingEl.remove();
        },
        (xhr) => {
          if (loadingEl && xhr.total) {
            const pct = Math.round((xhr.loaded / xhr.total) * 100);
            loadingEl.textContent = `姫路城 読込中… ${pct}%`;
          }
        },
        (err) => {
          console.error('姫路城モデルの読み込みに失敗しました', err);
          if (loadingEl) loadingEl.textContent = '姫路城モデルの読込に失敗しました';
        }
      );
    },
    undefined,
    (err) => {
      console.error('姫路城マテリアルの読み込みに失敗しました', err);
      if (loadingEl) loadingEl.textContent = '姫路城モデルの読込に失敗しました';
    }
  );

  renderer.render(scene, camera); // 初期状態（モデル読み込み前）の空シーンを一度描画
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initCastle3D);
} else {
  initCastle3D();
}
</script>
</body>
</html>
